name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Sin credenciales el sitio compila igual pero queda en blanco, así que
      # conviene fallar acá antes de publicar. No imprime los valores.
      - name: Verificar secrets de Supabase
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          if [ -z "$URL" ]; then echo "::error::Falta el secret VITE_SUPABASE_URL"; missing=1; else echo "VITE_SUPABASE_URL: presente (${#URL} caracteres)"; fi
          if [ -z "$KEY" ]; then echo "::error::Falta el secret VITE_SUPABASE_ANON_KEY"; missing=1; else echo "VITE_SUPABASE_ANON_KEY: presente (${#KEY} caracteres)"; fi
          if [ "$missing" = "1" ]; then
            echo "Cargalos en Settings → Secrets and variables → Actions → pestaña Secrets."
            exit 1
          fi

      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
